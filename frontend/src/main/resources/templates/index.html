<!DOCTYPE html>
<html data-bs-theme="dark" lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload PDF or Image</title>
    <!-- Bootstrap CSS -->
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <script>
        const BACKEND_URL = "[[${@environment.getProperty('tinia.backend.url')}]]";
    </script>
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Upload PDF or Image</h1>

    <!-- Alert messages -->
    <div id="alertPlaceholder"></div>

    <!-- Upload form -->
    <form class="border p-4 rounded" id="uploadForm">
        <div class="mb-3">
            <label class="form-label" for="file">Select file (PDF or image)</label>
            <input accept=".pdf,image/*" class="form-control" id="file" name="file" required type="file">
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" id="processOcr" name="processOcr" type="checkbox">
            <label class="form-check-label" for="processOcr">Process with OCR</label>
        </div>

        <button class="btn btn-primary" type="submit">Upload</button>
    </form>
</div>

<!-- spinner while there is no result yet to be displayed -->
<div id="processingView" class="text-center mt-5 d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    <p class="mt-3">
        Analyzing PDF...
    </p>
</div>

<!-- View to validate results -->
<div id="viewerView" class="d-none mt-4 text-center">

    <div id="pdfContainer"
         class="position-relative d-inline-block">

        <img id="pdfImage"
             style="max-width: 800px; width: 100%; height: auto;"
             src="">

        <svg id="overlaySvg"
             class="position-absolute top-0 start-0 w-100 h-100">
        </svg>

    </div>

</div>
<!-- Bootstrap JS -->
<script src="/webjars/bootstrap/js/bootstrap.min.js"></script>

<!-- Your JS to perform API call -->
<script src="/js/sse.js"></script>
</body>
</html>
