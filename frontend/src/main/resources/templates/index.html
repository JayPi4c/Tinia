<!DOCTYPE html>
<html data-bs-theme="dark" lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload PDF or Image</title>
    <!-- Bootstrap CSS -->
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <script>
        const BACKEND_URL = "[[${@environment.getProperty('tinia.backend.url')}]]";
    </script>
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Upload PDF or Image</h1>

    <!-- Alert messages -->
    <div id="alertPlaceholder"></div>

    <!-- Upload form -->
    <form class="border p-4 rounded" id="uploadForm">
        <div class="mb-3">
            <label class="form-label" for="file">Select file (PDF or image)</label>
            <input accept=".pdf,image/*" class="form-control" id="file" name="file" required type="file">
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" id="processOcr" name="processOcr" type="checkbox">
            <label class="form-check-label" for="processOcr">Process with OCR</label>
        </div>

        <button class="btn btn-primary" type="submit">Upload</button>
    </form>
</div>

<!-- spinner while there is no result yet to be displayed -->
<div id="processingView" class="text-center mt-5 d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    <p class="mt-3">
        Analyzing PDF...
    </p>
</div>

<!-- View to validate results -->
<div id="viewerView" class="container-fluid d-none">

    ```
    <div class="row">

        <!-- PDF VIEWER -->
        <div class="col-lg-9">

            <div id="pdfContainer"
                 class="position-relative d-inline-block">

                <img id="pdfImage"
                     src=""
                     style="max-width:100%;width:100%;height:auto;">

                <svg id="overlaySvg"
                     class="position-absolute top-0 start-0 w-100 h-100">
                </svg>

            </div>

        </div>

        <!-- TOOLBOX -->
        <div class="col-lg-3">

            <div class="card sticky-top">

                <div class="card-header">
                    Cell Editor
                </div>

                <div class="card-body">

                    <h6>Mode</h6>

                    <div class="d-grid gap-2">

                        <button id="selectModeBtn"
                                class="btn btn-outline-primary active">
                            Select
                        </button>
                        <button id="splitHorizontalBtn" class="btn btn-outline-primary">
                            Split Horizontal
                        </button>
                        <button id="splitVerticalBtn" class="btn btn-outline-primary">
                            Split Vertical
                        </button>
                        <button id="deleteBtn" class="btn btn-outline-danger">
                            Delete
                        </button>
                        <button id="mappingBtn" class="btn btn-outline-success">
                            Mapping
                        </button>
                    </div>
                    <hr>
                    <h6>Selection</h6>
                    <div id="selectionInfo">
                        No cell selected
                    </div>
                    <hr>
                    <h6>History</h6>
                    <div class="d-grid gap-2">
                        <button id="undoBtn" class="btn btn-outline-secondary">
                            Undo
                        </button>
                        <button id="redoBtn" class="btn btn-outline-secondary">
                            Redo
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="/webjars/bootstrap/js/bootstrap.min.js"></script>

<!-- Your JS to perform API call -->
<script src="/js/sse.js"></script>
</body>
</html>
